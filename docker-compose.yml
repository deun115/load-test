version: "3.8"

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./inputs:/images
    ports:
      - "80:80"
  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - 27017:27017
    volumes:
      - ./mongo-data:/data
    environment:
      - MONGO_INITDB_ROOT_USERNAME=rootuser
      - MONGO_INITDB_ROOT_PASSWORD=rootpass
  fastapi:
    image: canvas:2.0.0
    container_name: fastapi-server
    user: vience
    hostname: vience
    ports:
      - "11567:11567"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    shm_size: "8G"
    volumes:
      - /home/esy14/esy14-mongodb:/workspace
      - /home/vience/cloud:/cloud
      - /atlantic_data:/cache_data
    stdin_open: true
    tty: true

networks:
  default:
    name: mongodb_network
